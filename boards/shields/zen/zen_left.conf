CONFIG_ZMK_KEYBOARD_NAME="ZEN"
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_CDC_ACM_BOOTLOADER_TRIGGER=y
CONFIG_ZMK_STATUS_LED=y
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=9000000
CONFIG_ZMK_NON_LIPO_MIN_MV=1000
CONFIG_ZMK_NON_LIPO_LOW_MV=900

# Troubleshooting: 安定性(ウォッチドッグ)— 左手分の記録用
CONFIG_ZMK_WATCHDOG=y

# Troubleshooting: キースイッチ(kscan診断)— 左手分のトポロジ・統計用
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256
