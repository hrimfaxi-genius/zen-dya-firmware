# ZMK's split central and BLE integration use the shared zmk log module.
CONFIG_ZMK_LOG_LEVEL_DBG=y

# Limit Zephyr Bluetooth debug output to the host layers directly involved in
# scanning, connection state transitions, and pairing/bonding security.
CONFIG_BT_HCI_CORE_LOG_LEVEL_DBG=y
CONFIG_BT_CONN_LOG_LEVEL_DBG=y
CONFIG_BT_SMP_LOG_LEVEL_DBG=y

# Preserve early boot messages until Windows has enumerated the CDC-ACM port.
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
